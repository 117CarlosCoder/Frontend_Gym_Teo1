name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-gym

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-gym/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npx ng test --no-watch --no-progress

      - name: Build
        run: npm run build

    concurrency:
        group: deploy-ec2
        cancel-in-progress: false
